<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RIYA // FRIDAY PROTOCOL</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Ambient Holographic Environment -->
  <div class="ambient-ring ring-1"></div>
  <div class="ambient-ring ring-2"></div>

  <div class="hud-wrapper">
    
    <!-- Top Telemetry & Branding -->
    <header class="top-telemetry">
      <div class="telemetry-node">
        <span>SYS.LINK</span>
        <span style="color: #fff">ENCRYPTED</span>
      </div>
      <div class="sys-title">RIYA</div>
      <div class="telemetry-node">
        <span>PWR</span>
        <span style="color: #fff">OPTIMAL</span>
      </div>
    </header>

    <!-- Main Holographic Interface -->
    <main class="main-stage">
      
      <!-- Left: The Core (FRIDAY Orb) -->
      <section class="core-module">
        <div class="orb-container">
          <div class="data-ring"></div>
          <div class="orb-ring orb-ring-1"></div>
          <div class="orb-ring orb-ring-2"></div>
          <div class="orb-ring orb-ring-3"></div>
          
          <div id="orb" class="orb-core state-idle"></div>
        </div>
        <div id="status-text" class="core-status">ONLINE</div>
      </section>

      <!-- Right: Floating AR Chat Interface -->
      <section class="chat-module">
        <div id="chat-feed" class="chat-feed">
          <!-- Floating messages appear here -->
        </div>

        <div class="input-module">
          <textarea id="chat-input" placeholder="Initiate sequence..." rows="1" autofocus></textarea>
          <button id="mic-btn" class="mic-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="22"></line>
            </svg>
          </button>
        </div>
      </section>

    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
