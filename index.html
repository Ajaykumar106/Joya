<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Riya AI — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  
  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Global Styles & App Logic -->
  <link rel="stylesheet" href="css/global.css"/>
  <script src="js/auth.js" defer></script>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      background: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    /* Split Screen Layout */
    .split-left {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: linear-gradient(135deg, #090b14 0%, #110e20 100%);
      overflow: hidden;
    }

    .split-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-panel);
      position: relative;
      z-index: 10;
      box-shadow: -10px 0 30px rgba(0,0,0,0.5);
    }

    /* Animated AI Orb on Left Side */
    .ai-orb-container {
      position: relative;
      width: 400px;
      height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ai-orb {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      box-shadow: 0 0 100px #7c3aed, 0 0 200px #ec4899;
      animation: pulse-orb 4s infinite alternate ease-in-out;
      z-index: 2;
    }
    .ai-ring {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.1);
      animation: spin-ring 10s linear infinite;
    }
    .ai-ring:nth-child(2) {
      width: 400px;
      height: 400px;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      animation: spin-ring 15s linear infinite reverse;
    }

    @keyframes pulse-orb {
      0% { transform: scale(0.9); box-shadow: 0 0 80px #7c3aed; }
      100% { transform: scale(1.1); box-shadow: 0 0 150px #ec4899; }
    }
    @keyframes spin-ring {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .left-text {
      position: absolute;
      bottom: 10%;
      text-align: center;
      z-index: 10;
    }
    .left-text h2 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 10px;
      background: -webkit-linear-gradient(#fff, #a371f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .left-text p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* Login Panel on Right Side */
    .login-box {
      width: 100%;
      max-width: 400px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      text-align: center;
    }
    .login-logo {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #a371f7, #58a6ff);
      border-radius: 16px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      color: white;
      box-shadow: 0 10px 20px rgba(163, 113, 247, 0.3);
    }
    .login-box h1 {
      font-size: 28px;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .login-box p {
      color: var(--text-muted);
      margin-bottom: 30px;
      font-size: 14px;
    }

    .google-btn {
      width: 100%;
      padding: 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.3s ease;
      font-family: inherit;
    }
    .google-btn:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.2);
      transform: translateY(-2px);
    }
    .google-btn img {
      width: 20px;
      height: 20px;
    }

    .loading-msg {
      display: none;
      margin-top: 20px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 500;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @media (max-width: 900px) {
      body { flex-direction: column; }
      .split-left { display: none; }
      .split-right { padding: 20px; justify-content: center; background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop') center/cover no-repeat; }
      .split-right::before {
        content: '';
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(10px);
      }
    }
  </style>
</head>
<body>

  <!-- Left Side: Visuals -->
  <div class="split-left">
    <div class="ai-orb-container">
      <div class="ai-ring"></div>
      <div class="ai-ring"></div>
      <div class="ai-orb"></div>
    </div>
    <div class="left-text">
      <h2>Welcome to Riya AI</h2>
      <p>Your ultra-intelligent AI companion.</p>
    </div>
  </div>

  <!-- Right Side: Login -->
  <div class="split-right">
    <div class="login-box">
      <div class="login-logo">✦</div>
      <h1>Riya AI</h1>
      <p>Log in to access your dashboard and intelligent agents.</p>

      <button class="google-btn" id="loginBtn" onclick="login()">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google">
        Continue with Google
      </button>

      <div class="loading-msg" id="loginLoader">Authenticating... Please wait</div>
    </div>
  </div>

  <script>
    function login() {
      document.getElementById('loginBtn').disabled = true;
      document.getElementById('loginBtn').style.opacity = '0.5';
      document.getElementById('loginLoader').style.display = 'block';
      if (typeof handleGoogleLogin === 'function') {
        handleGoogleLogin();
      }
    }
  </script>
</body>
</html>
