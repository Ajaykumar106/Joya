<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Riya AI — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="css/global.css"/>
  <script src="js/auth.js" defer></script>
  <style>
    body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#06060f;color:#fff;font-family:'Inter',sans-serif;overflow:hidden;position:relative;}
    /* Subtle background glow */
    body::before{content:'';position:absolute;top:30%;left:50%;width:500px;height:500px;background:radial-gradient(circle,rgba(124,58,237,0.12),transparent 70%);transform:translate(-50%,-50%);pointer-events:none;}

    .login-card{width:100%;max-width:400px;padding:48px 40px;background:rgba(255,255,255,0.03);border:1px solid rgba(139,92,246,0.18);border-radius:28px;backdrop-filter:blur(30px);box-shadow:0 24px 80px rgba(0,0,0,0.5),0 0 60px rgba(124,58,237,0.06);text-align:center;}
    .login-logo{width:68px;height:68px;margin:0 auto 28px;background:linear-gradient(135deg,#7c3aed,#3b82f6);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 10px 30px rgba(124,58,237,0.4);}
    .login-card h1{font-size:28px;font-weight:700;margin-bottom:6px;}
    .login-card h1 span{color:#a78bfa;}
    .login-card .sub{color:rgba(255,255,255,0.4);font-size:14px;margin-bottom:36px;line-height:1.5;}
    .google-btn{width:100%;padding:16px;background:linear-gradient(135deg,rgba(124,58,237,0.2),rgba(59,130,246,0.2));border:1px solid rgba(139,92,246,0.35);border-radius:14px;color:white;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;transition:all .3s;font-family:inherit;}
    .google-btn:hover{background:linear-gradient(135deg,rgba(124,58,237,0.35),rgba(59,130,246,0.35));border-color:rgba(139,92,246,0.6);transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,58,237,0.3);}
    .google-btn img{width:20px;height:20px;}
    .divider{display:flex;align-items:center;gap:16px;margin:28px 0;color:rgba(255,255,255,0.2);font-size:12px;}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.08);}
    .features{display:flex;gap:12px;}
    .feat{flex:1;text-align:center;padding:14px 8px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);border-radius:14px;font-size:11px;color:rgba(255,255,255,0.45);}
    .feat .icon{display:block;font-size:22px;margin-bottom:6px;}
    .footer{margin-top:28px;font-size:12px;color:rgba(255,255,255,0.25);}
    .loader{display:none;margin-top:16px;color:#a78bfa;font-size:13px;animation:pulse 1.5s infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">✦</div>
    <h1>Riya<span>.AI</span></h1>
    <p class="sub">Your AI. Your Universe.<br/>Sign in to access your intelligent dashboard.</p>
    <button class="google-btn" id="loginBtn" onclick="doLogin()">
      <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="G"/>
      Continue with Google
    </button>
    <div class="loader" id="loader">Authenticating… Please wait</div>
    <div class="divider">Powered by AI</div>
    <div class="features">
      <div class="feat"><span class="icon">🧠</span>Deep Thinking</div>
      <div class="feat"><span class="icon">📊</span>Live Markets</div>
      <div class="feat"><span class="icon">🚀</span>AI Agents</div>
    </div>
    <div class="footer">Built with ❤️ by Ajay Kumar AJ · 2026</div>
  </div>
  <script>
    function doLogin(){
      document.getElementById('loginBtn').disabled=true;
      document.getElementById('loginBtn').style.opacity='0.5';
      document.getElementById('loader').style.display='block';
      if(typeof handleGoogleLogin==='function') handleGoogleLogin();
    }
  </script>
</body>
</html>
