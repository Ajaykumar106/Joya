<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Riya - Concept 2</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Cinematic Background -->
  <div class="cinematic-bg"></div>
  <div class="vignette-overlay"></div>

  <!-- Awwwards Frame / Decorative Lines -->
  <div class="frame-lines">
    <div class="line line-top"></div>
    <div class="line line-bottom"></div>
    <div class="line line-left"></div>
    <div class="line line-right"></div>
  </div>

  <div class="app-layout">
    
    <!-- LEFT SIDE: Editorial Typography -->
    <div class="editorial-sidebar">
      <div class="editorial-header">
        <h1 class="brand-title">RIYA</h1>
        <p class="brand-subtitle">THE NEXT EVOLUTION</p>
      </div>
      <div class="editorial-footer">
        <div class="status-indicator">
          <div id="orb" class="orb state-idle">
            <div class="ring"></div>
            <div class="core"></div>
          </div>
          <span id="status-text" class="status-text">SYSTEM ONLINE</span>
        </div>
      </div>
    </div>

    <!-- RIGHT SIDE: The Glass Panel -->
    <div class="interaction-panel">
      
      <div id="chat-feed" class="chat-feed">
        <!-- Messages go here -->
      </div>

      <div class="input-area">
        <div class="glass-input-wrapper">
          <textarea id="chat-input" placeholder="Initiate sequence..." rows="1" autofocus></textarea>
          <button id="mic-btn" class="mic-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="22"></line>
            </svg>
          </button>
        </div>
      </div>

    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
