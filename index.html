<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Riya Premium</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Ambient Background Glows -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="app-wrapper">
    <div class="glass-container">
      
      <!-- TOP BAR -->
      <div class="top-bar">
        <div class="brand">
          <svg class="butterfly-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2c-1.5 1.5-2 3-2 5s.5 3.5 2 5c1.5-1.5 2-3 2-5s-.5-3.5-2-5z"/>
            <path d="M12 12c-2 1.5-4 1.5-6 1C4 12.5 3 10 3 8c1-1 3-1 5 0 1.5.5 2.5 2 4 4z"/>
            <path d="M12 12c2 1.5 4 1.5 6 1 2-.5 3-3 3-5-1-1-3-1-5 0-1.5.5-2.5 2-4 4z"/>
            <path d="M12 12c-2-1.5-4-1.5-6-1-2 .5-3 3-3 5 1 1 3 1 5 0 1.5-.5 2.5-2 4-4z"/>
            <path d="M12 12c2-1.5 4-1.5 6-1 2 .5 3 3 3 5-1 1-3 1-5 0-1.5-.5-2.5-2-4-4z"/>
          </svg>
          <span class="brand-name">RIYA</span>
        </div>
        
        <div class="orb-wrapper">
          <div id="orb" class="orb state-idle">
            <div class="ring"></div>
            <div class="core"></div>
          </div>
          <div id="status-text" class="status-text">ONLINE</div>
        </div>
      </div>

      <!-- CHAT FEED -->
      <div id="chat-feed" class="chat-feed">
        <!-- Messages go here -->
      </div>

      <!-- INPUT AREA -->
      <div class="input-area">
        <div class="input-glass">
          <textarea id="chat-input" placeholder="Message Riya..." rows="1" autofocus></textarea>
          <button id="mic-btn" class="action-btn mic-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="22"></line>
            </svg>
          </button>
        </div>
      </div>

    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
