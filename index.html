<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Riya.AI — Login</title>
  
  <link rel="stylesheet" href="css/global.css"/>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  
  <script src="js/auth.js" defer></script>

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    .monochrome-login-card {
      width: 100%;
      max-width: 420px;
      padding: 44px 38px;
      background: #0a0a0d;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-xl);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
      text-align: center;
    }

    .brand-avatar-black {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: #ffffff;
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      margin: 0 auto 24px;
    }

    .login-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .login-sub {
      font-size: 13.5px;
      color: var(--text-secondary);
      margin-bottom: 36px;
      line-height: 1.5;
    }

    .btn-google-login {
      width: 100%;
      padding: 15px;
      background: #ffffff;
      border: none;
      border-radius: var(--radius-pill);
      color: #000000;
      font-size: 14.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.25s ease;
      margin-bottom: 24px;
    }

    .btn-google-login:hover {
      background: #e2e8f0;
      transform: translateY(-1px);
    }

    .btn-google-login svg {
      width: 20px;
      height: 20px;
    }

    .auth-loader {
      display: none;
      font-size: 13px;
      color: #ffffff;
      margin-top: 14px;
      font-weight: 600;
    }

    .login-footer-text {
      margin-top: 28px;
      font-size: 11.5px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="monochrome-login-card">
    <div class="brand-avatar-black">🪐</div>
    <h1 class="login-title">Riya.AI Studio</h1>
    <p class="login-sub">Sign in to access your intelligent software workspace, live market data, and research agents.</p>

    <button class="btn-google-login" id="loginBtn" onclick="doLogin()">
      <svg viewBox="0 0 24 24">
        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/>
        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
        <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12.5s.7 2.8 1.9 5.2l3.7-2.9z"/>
        <path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 17C3.7 20.7 7.5 24 12 24z"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-loader" id="authLoader">Authenticating... Please wait</div>
    <div class="auth-error" id="authErr" style="display:none; color:#f87171; font-size:12px; margin-top:10px;"></div>

    <div class="login-footer-text">
      Engineered by Ajay Kumar AJ · 2026
    </div>
  </div>

  <script>
    function doLogin() {
      const btn = document.getElementById('loginBtn');
      const loader = document.getElementById('authLoader');
      if (btn) { btn.disabled = true; btn.style.opacity = '0.5'; }
      if (loader) loader.style.display = 'block';

      if (typeof handleGoogleLogin === 'function') {
        handleGoogleLogin();
      }
    }
  </script>
</body>
</html>
