<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Riya.AI — Login</title>
  
  <link rel="stylesheet" href="css/global.css"/>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  
  <script src="js/auth.js" defer></script>

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(34, 211, 238, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(167, 139, 250, 0.05) 0%, transparent 40%),
        linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.8));
      margin: 0;
      height: 100vh;
    }

    .monochrome-login-card {
      width: 100%;
      max-width: 420px;
      padding: 44px 38px;
      background: rgba(18, 22, 33, 0.4);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .brand-logo-box {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .brand-logo-box svg {
      stroke: #fff;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.4));
    }

    .login-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .login-sub {
      font-size: 13.5px;
      color: #94a3b8;
      margin-bottom: 36px;
      line-height: 1.5;
    }

    .btn-google-login {
      width: 100%;
      padding: 15px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      color: #ffffff;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.25s ease;
      margin-bottom: 24px;
    }

    .btn-google-login:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    .btn-google-login svg {
      width: 20px;
      height: 20px;
    }

    .auth-loader {
      display: none;
      font-size: 13px;
      color: #ffffff;
      margin-top: 14px;
      font-weight: 600;
    }

    .login-footer-text {
      margin-top: 28px;
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

  <div class="monochrome-login-card">
    <div class="brand-logo-box">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2.5C9.5 2.5 7.5 4.5 7.5 7v2H12l5.5-5.5a3.5 3.5 0 0 0-5.5-1z"/>
        <path d="M12 2.5C14.5 2.5 16.5 4.5 16.5 7v2H12L6.5 3.5a3.5 3.5 0 0 1 5.5-1z"/>
        <path d="M7.5 9A4.5 4.5 0 0 0 3 13.5c0 2.5 2 4.5 4.5 4.5H12V9H7.5z"/>
        <path d="M16.5 9A4.5 4.5 0 0 1 21 13.5c0 2.5-2 4.5-4.5 4.5H12V9h4.5z"/>
        <path d="M12 21.5v-3.5"/>
      </svg>
    </div>
    
    <h1 class="login-title">Riya.AI Command</h1>
    <p class="login-sub">Sign in to access your intelligent software workspace, live market data, and research agents.</p>

    <button class="btn-google-login" id="loginBtn" onclick="doLogin()">
      <svg viewBox="0 0 24 24">
        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/>
        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
        <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12.5s.7 2.8 1.9 5.2l3.7-2.9z"/>
        <path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 17C3.7 20.7 7.5 24 12 24z"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-loader" id="authLoader">Authenticating... Please wait</div>
    <div class="auth-error" id="authErr" style="display:none; color:#f87171; font-size:12px; margin-top:10px;"></div>

    <div class="login-footer-text">
      Engineered by Ajay Kumar AJ · 2026
    </div>
  </div>

  <script>
    function doLogin() {
      const btn = document.getElementById('loginBtn');
      const loader = document.getElementById('authLoader');
      if (btn) { btn.disabled = true; btn.style.opacity = '0.5'; }
      if (loader) loader.style.display = 'block';

      if (typeof handleGoogleLogin === 'function') {
        handleGoogleLogin();
      }
    }
  </script>
</body>
</html>
